spring.application.name=citas-backend

# Base de datos
spring.datasource.url=jdbc:mariadb://localhost:3306/citas_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Servidor SMTP; por defecto usa un receptor local como Mailpit.
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

# Mailpit no requiere autenticacion local
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}

# Limites de espera
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
