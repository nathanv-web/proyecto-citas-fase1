<main class="page page-narrow">
  <header class="page-header">
    <div>
      <h1>Cambiar contraseña</h1>
      <p>Después del cambio deberás iniciar sesión nuevamente.</p>
    </div>
  </header>
  <section class="form-card">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="field">
        <label for="current-password">Contraseña actual</label>
        <input
          id="current-password"
          type="password"
          autocomplete="current-password"
          formControlName="actual"
        />
      </div>
      <div class="field">
        <label for="new-password">Nueva contraseña</label>
        <input
          id="new-password"
          type="password"
          autocomplete="new-password"
          formControlName="nueva"
          aria-describedby="password-help"
        />
        <small id="password-help">Entre 8 y 64 caracteres. Debe ser diferente de la actual.</small>
      </div>
      <div class="field">
        <label for="confirm-password">Confirmar nueva contraseña</label>
        <input
          id="confirm-password"
          type="password"
          autocomplete="new-password"
          formControlName="confirmacion"
        />
        @if (form.touched && form.hasError('different')) {
          <small>Las contraseñas no coinciden.</small>
        }
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit" [disabled]="saving() || form.invalid">
          Guardar contraseña
        </button>
        <button class="btn" type="button" (click)="logout()">Cerrar sesión</button>
      </div>
    </form>
  </section>
</main>
