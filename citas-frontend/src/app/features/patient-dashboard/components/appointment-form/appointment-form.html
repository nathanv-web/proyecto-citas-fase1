<div class="reserva-container" style="margin-top: 20px; padding: 15px; border: 2px solid #007bff; border-radius: 5px; background-color: #f0f8ff;">
  <h3>Reservar Cita</h3>
  <p>Ingresa el ID del horario que elegiste arriba y el motivo de tu consulta:</p>

  
  <form (ngSubmit)="reservarCita()">
    <div style="margin-bottom: 10px;">
      <label style="display: block; font-weight: bold;">ID del Horario:</label>
      <input type="number" name="idHorario" [(ngModel)]="datosReserva.idHorario" required style="width: 100%; padding: 8px; box-sizing: border-box;" placeholder="Ej. 5">
    </div>

    <div style="margin-bottom: 10px;">
      <label style="display: block; font-weight: bold;">Motivo de la consulta:</label>
      <textarea name="motivo" [(ngModel)]="datosReserva.motivo" rows="3" style="width: 100%; padding: 8px; box-sizing: border-box;" placeholder="Ej. Chequeo general..."></textarea>
    </div>

    <button type="submit" style="padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Confirmar Reserva
    </button>
  </form>

  @if (mensaje) {
    <p style="margin-top: 10px; font-weight: bold; color: #28a745;">{{ mensaje }}</p>
  }
</div>
