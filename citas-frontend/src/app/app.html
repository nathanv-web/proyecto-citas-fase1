<app-toast-container />
<app-confirmation-dialog />
@if (showPanelNavigation()) {
  <header class="panel-navigation">
    <app-user-profile />
    <a class="app-brand" routerLink="/panels" aria-label="CitaNova, selector de paneles">
      <span class="brand-symbol" aria-hidden="true">✚</span>
      <span class="brand-copy">
        <strong>Cita<span>Nova</span></strong>
        <small>Tu salud en un clic</small>
      </span>
    </a>
  </header>
}
<div class="workspace" [class.with-sidebar]="showSidebar()">
  @if (showSidebar()) {
    <app-sidebar [currentUrl]="currentUrl()" />
  }
  <div class="workspace-content">
    <router-outlet />
  </div>
</div>
